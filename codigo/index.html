<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>SPA Cadastro de Pets</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<div class="container">

    <h1>Sistema de Cadastro de Pets</h1>

    <div id="mensagem"></div>

    <section class="card">

        <h2>Cadastro</h2>

        <input type="hidden" id="id">

        <label>Nome</label>
        <input type="text" id="nome">

        <label>Espécie</label>
        <input type="text" id="especie">

        <label>Raça</label>
        <input type="text" id="raca">

        <label>Idade</label>
        <input type="number" id="idade">

        <label>Dono</label>
        <input type="text" id="dono">

        <label>Tipo</label>
        <input type="text" id="tipo">

        <div class="acoes">

            <button id="btnSalvar">
                Salvar
            </button>

            <button id="btnNovo">
                Novo
            </button>

        </div>

    </section>

    <section class="card">

        <h2>Pesquisar por Tipo</h2>

        <input id="tipoBusca">

        <button id="btnBuscarTipo">
            Buscar
        </button>

        <button id="btnListarTodos">
            Todos
        </button>

    </section>

    <section class="card">

        <h2>Pets Cadastrados</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Espécie</th>
                    <th>Raça</th>
                    <th>Idade</th>
                    <th>Dono</th>
                    <th>Tipo</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tbodyPets">

            </tbody>

        </table>

        <div id="pagination">

        </div>

    </section>

</div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
